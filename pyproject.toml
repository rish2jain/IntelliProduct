[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-intel"
version = "0.1.0"
description = "Integrated Product Intelligence Agent — Phase A: discovery, price context, SQLite tracking, and a launchd monitor with Layer 1/2 alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rish2jain" }]
dependencies = [
    "httpx>=0.27",
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
product-intel = "product_intel.server:main"
product-intel-monitor = "product_intel.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
