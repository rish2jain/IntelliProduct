name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (fully offline — fakes only)
        run: pytest
        env:
          PRODUCT_INTEL_FAKE: "1"
      - name: Demo smoke test
        run: python -m product_intel.demo
        env:
          PRODUCT_INTEL_FAKE: "1"
